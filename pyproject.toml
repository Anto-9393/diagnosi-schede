# Rende "diagnosi" un pacchetto installabile: con `pip install -e .` gli script in scripts/
# possono fare `from diagnosi import ...` da qualunque cartella.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diagnosi-schede"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diagnosi = ["prompts/*.md"]
